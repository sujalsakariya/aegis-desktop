# Builds the Windows installer and the macOS disk image on GitHub's own
# machines and attaches both to a GitHub release.
#
# Start it by pushing a version tag that matches package.json:
#   git tag v1.2.1 && git push origin v1.2.1
# or run it by hand from the Actions tab (it then only uploads build artifacts).
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: release/*.exe
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # .env.production (live API + public keys) is baked into the app here.
      - run: npm run ${{ matrix.script }}
        env:
          # No Apple / Windows code-signing certificate yet: do not look for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The bundled ClamAV must download real signatures, start, and detect a
      # test threat from inside the built app, on both platforms.
      - name: Engine smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then node scripts/engine-smoke.mjs release/mac-universal/Aegis.app/Contents/Resources/clamav
          else node scripts/engine-smoke.mjs release/win-unpacked/resources/clamav; fi
      # Launch the packaged Mac app for real: it must start, stay running and
      # reach the live API. Fails the build instead of shipping a broken .dmg.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=release/mac-universal/Aegis.app
          codesign --verify --deep --strict "$APP" && echo "Signature OK (ad-hoc)"
          lipo -archs "$APP/Contents/MacOS/Aegis"
          "$APP/Contents/MacOS/Aegis" > app.log 2>&1 &
          sleep 30
          cat app.log
          pgrep -f "Aegis.app/Contents/MacOS/Aegis" > /dev/null || { echo "Aegis exited during startup"; exit 1; }
          echo "Aegis is running"
          pkill -f "Aegis.app/Contents/MacOS/Aegis" || true
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # ClamAV is GPL-2.0: publish its exact source next to the installers.
      - name: ClamAV source code
        run: |
          VERSION=$(grep -o "CLAMAV_VERSION = '[0-9.]*'" scripts/fetch-clamav.mjs | grep -o "[0-9.]*[0-9]")
          curl -fsSL -o "installers/clamav-$VERSION-source.tar.gz" "https://github.com/Cisco-Talos/clamav/releases/download/clamav-$VERSION/clamav-$VERSION.tar.gz"
      - name: Checksums
        run: cd installers && sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          body: |
            **Windows:** download `Aegis-Setup.exe` and run it.

            Aegis scans with the bundled ClamAV® engine; the first start downloads about 110 MB of official ClamAV signatures. ClamAV's source code (GPL-2.0) is attached to this release.

            **macOS (Intel and Apple silicon):** download the `.dmg`, open it and drag Aegis to Applications.
            The first time, macOS says it cannot check the app for malware. Open **System Settings → Privacy & Security**,
            scroll down and click **Open Anyway** next to Aegis (on older macOS: right-click Aegis → Open).
